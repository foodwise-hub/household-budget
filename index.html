/* ============================================================
   10. GOOGLE SIGN-IN (Google Identity Services, token flow)
   ============================================================ */
const CLIENT_ID = '574909313987-gcgdmbho1m3rcjbg016dadpprdf4mfo8.apps.googleusercontent.com';
const SHEET_ID  = '1uIf-YbhAzMj5_OkDV6PQ6Dz-L0wdT0YJ1UbF0MyHHwM';
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID;
const SCOPES = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile';

let tokenClient=null, accessToken=null, tokenExpiry=0, user=null;
let tokenResolve=null, tokenReject=null;

function authMsg(msg, isErr){
  const el = document.getElementById('authMsg');
  el.textContent = msg;
  el.className = 'authmsg' + (isErr ? ' err' : '');
}

function gisLoaded(){
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: resp => {
      if(resp.error){ if(tokenReject) tokenReject(new Error(resp.error)); }
      else {
        accessToken = resp.access_token;
        tokenExpiry = Date.now() + (Number(resp.expires_in || 3600) - 120) * 1000;
        if(tokenResolve) tokenResolve();
      }
      tokenResolve = tokenReject = null;
    },
    error_callback: err => {
      if(tokenReject){
        const e = new Error(err && err.type ? err.type : 'sign_in_failed');
        e.reauth = true;
        tokenReject(e);
      }
      tokenResolve = tokenReject = null;
    }
  });
  document.getElementById('signInBtn').disabled = false;
  authMsg('');
}
function gisFailed(){
  authMsg('Google sign-in could not load. Check your connection and refresh the page.', true);
}

function requestToken(){
  return new Promise((resolve, reject)=>{
    tokenResolve = resolve; tokenReject = reject;
    tokenClient.requestAccessToken({prompt:''});
  });
}

async function ensureToken(){
  if(accessToken && Date.now() < tokenExpiry) return;
  await requestToken();   // silently refreshes if the Google session is still valid
}

async function api(url, opts, retry){
  await ensureToken();
  const headers = Object.assign({Authorization:'Bearer '+accessToken}, (opts && opts.body) ? {'Content-Type':'application/json'} : {});
  const res = await fetch(url, Object.assign({}, opts, {headers}));
  if(res.status===401 && retry!==false){
    accessToken = null;
    return api(url, opts, false);
  }
  if(!res.ok){
    let detail=''; try{ detail=(await res.text()).slice(0,300); }catch(e){}
    const err = new Error('Google API error '+res.status+': '+detail);
    err.status = res.status;
    if(res.status===401) err.reauth = true;
    throw err;
  }
  return res.json();
}

function signOut(){
  const finish = () => location.reload();
  try{ google.accounts.oauth2.revoke(accessToken, finish); setTimeout(finish, 800); }
  catch(e){ finish(); }
}

/* ============================================================
   11. GOOGLE SHEETS — the database
   ============================================================ */
const SHEETS_BASE = 'https://sheets.googleapis.com/v4/spreadsheets/' + SHEET_ID;
const TABS = {
  Transactions: ['id','date','desc','amount','cat','src','rec','oneoff','approx'],
  Recurring:    ['id','name','amount','cat','method','day','match','estimated','startMonth'],
  Budgets:      ['cat','on','amount','name'],
  Goals:        ['id','name','target','monthly','accounts'],
  Accounts:     ['id','name','type'],
  Snapshots:    ['month','account','value'],
  Rules:        ['phrase','cat'],
  Raises:       ['id','month','amount','reason','note']
};
const TAB_NAMES = Object.keys(TABS);

const S = v => v==null ? '' : String(v);
const N = v => typeof v==='number' ? v : (parseFloat(v) || 0);
const B = v => v===true || v==='TRUE' || v==='true';

async function ensureTabs(){
  const meta = await api(SHEETS_BASE + '?fields=sheets.properties.title');
  const have = new Set((meta.sheets||[]).map(s=>s.properties.title));
  const missing = TAB_NAMES.filter(t=>!have.has(t));
  if(missing.length){
    await api(SHEETS_BASE + ':batchUpdate', {method:'POST',
      body: JSON.stringify({requests: missing.map(title=>({addSheet:{properties:{title}}}))})});
  }
  return missing.length > 0;
}

/* Read every tab and rebuild state from it */
async function loadAll(){
  const qs = TAB_NAMES.map(n=>'ranges='+encodeURIComponent(n)).join('&');
  const res = await api(SHEETS_BASE + '/values:batchGet?' + qs + '&valueRenderOption=UNFORMATTED_VALUE');
  const raw = {};
  let allHaveHeaders = true;
  (res.valueRanges||[]).forEach((vr,i)=>{
    const rows = vr.values || [];
    if(!rows.length) allHaveHeaders = false;
    raw[TAB_NAMES[i]] = rows.slice(1);
  });
  const rows = t => raw[t] || [];

  state.transactions = rows('Transactions').filter(r=>S(r[0])).map(r=>{
    const t = {id:S(r[0]), date:S(r[1]), desc:S(r[2]), amount:N(r[3]), cat:S(r[4])||'uncat', src:S(r[5])||'card'};
    if(S(r[6])) t.rec = S(r[6]);
    if(B(r[7])) t.oneoff = true;
    if(B(r[8])) t.approx = true;
    return t;
  });

  state.recurring = rows('Recurring').filter(r=>S(r[0])).map(r=>{
    const rec = {
      id:S(r[0]), name:S(r[1]), amount:N(r[2]), cat:S(r[3])||'uncat',
      method:S(r[4])==='auto'?'auto':'card',
      day: S(r[5])==='' ? null : Math.round(N(r[5])),
      match:S(r[6]), estimated:B(r[7])
    };
    /* Added after the first rows were written, so anything saved before it
       existed simply has no cell here — and no startMonth means always on. */
    if(S(r[8])) rec.startMonth = S(r[8]);
    return rec;
  });

  const bud = CATEGORIES.reduce((o,c)=>(o[c.id]={on:false,amount:0},o),{});
  let overall = {on:false, amount:0};
  let travel  = {on:false, amount:0, name:'Trip'};
  rows('Budgets').forEach(r=>{
    const key = S(r[0]); if(!key) return;
    if(key==='__overall__')      overall = {on:B(r[1]), amount:N(r[2])};
    else if(key==='__travel__')  travel  = {on:B(r[1]), amount:N(r[2]), name:S(r[3])||'Trip'};
    else if(bud[key])            bud[key]= {on:B(r[1]), amount:N(r[2])};
  });
  state.budgets = bud; state.overall = overall; state.travelBudget = travel;

  state.goals = rows('Goals').filter(r=>S(r[0])).map(r=>({
    id:S(r[0]), name:S(r[1]), target:N(r[2]), monthly:N(r[3]),
    accounts: S(r[4]).split(',').map(s=>s.trim()).filter(Boolean)
  }));

  state.accounts = rows('Accounts').filter(r=>S(r[0])).map(r=>({id:S(r[0]), name:S(r[1]), type:S(r[2])||'savings'}));

  state.snapshots = {};
  rows('Snapshots').forEach(r=>{
    const m=S(r[0]), a=S(r[1]);
    if(!m || !a) return;
    (state.snapshots[m] = state.snapshots[m] || {})[a] = N(r[2]);
  });

  state.rules = rows('Rules').filter(r=>S(r[0])).map(r=>({phrase:S(r[0]), cat:S(r[1])||'uncat'}));

  state.raises = {};
  rows('Raises').forEach(r=>{
    const m=S(r[1]); if(!S(r[0]) || !m) return;
    (state.raises[m] = state.raises[m] || []).push({id:S(r[0]), amount:N(r[2]), reason:S(r[3])||'Other', note:S(r[4])});
  });

  return allHaveHeaders;
}

/* Turn state back into rows, one 2-D array per tab (header row included) */
function tabValues(){
  const v = {};
  v.Transactions = [TABS.Transactions].concat(state.transactions.map(t=>
    [t.id, t.date, t.desc, t.amount, t.cat, t.src, t.rec||'', t.oneoff?true:'', t.approx?true:'']));
  v.Recurring = [TABS.Recurring].concat(state.recurring.map(r=>
    [r.id, r.name, r.amount, r.cat, r.method, r.day==null?'':r.day, r.match||'', r.estimated?true:'', r.startMonth||'']));
  v.Budgets = [TABS.Budgets].concat(
    CATEGORIES.map(c=>[c.id, !!state.budgets[c.id].on, state.budgets[c.id].amount||0, '']),
    [['__overall__', !!state.overall.on, state.overall.amount||0, ''],
     ['__travel__', !!state.travelBudget.on, state.travelBudget.amount||0, state.travelBudget.name||'']]);
  v.Goals = [TABS.Goals].concat(state.goals.map(g=>[g.id, g.name, g.target, g.monthly, g.accounts.join(',')]));
  v.Accounts = [TABS.Accounts].concat(state.accounts.map(a=>[a.id, a.name, a.type]));
  v.Snapshots = [TABS.Snapshots];
  Object.keys(state.snapshots).sort().forEach(m=>{
    Object.keys(state.snapshots[m]).forEach(a=>v.Snapshots.push([m, a, state.snapshots[m][a]]));
  });
  v.Rules = [TABS.Rules].concat(state.rules.map(r=>[r.phrase, r.cat]));
  v.Raises = [TABS.Raises];
  Object.keys(state.raises).sort().forEach(m=>{
    state.raises[m].forEach(r=>v.Raises.push([r.id, m, r.amount, r.reason, r.note||'']));
  });
  return v;
}

async function saveAll(){
  const v = tabValues();
  await api(SHEETS_BASE + '/values:batchClear', {method:'POST',
    body: JSON.stringify({ranges: TAB_NAMES.map(t=>t+'!A2:Z')})});
  await api(SHEETS_BASE + '/values:batchUpdate', {method:'POST',
    body: JSON.stringify({valueInputOption:'RAW',
      data: TAB_NAMES.map(t=>({range: t+'!A1', values: v[t]}))})});
}

/* ============================================================
   12. SYNC LOOP — every change lands in the Sheet
   ============================================================ */
let loaded=false, saving=false, saveTimer=null, lastSaved='', syncState='';

const serialize = () => JSON.stringify([state.transactions, state.recurring, state.budgets,
  state.overall, state.travelBudget, state.goals, state.accounts, state.snapshots, state.rules, state.raises]);

const pill = document.getElementById('syncPill');
function syncStatus(s){
  syncState = s;
  if(s==='saving'){ pill.hidden=false; pill.textContent='Saving…'; pill.className='syncpill'; }
  else if(s==='saved'){
    pill.hidden=false; pill.textContent='Saved to the Sheet'; pill.className='syncpill ok';
    setTimeout(()=>{ if(syncState==='saved') pill.hidden=true; }, 1600);
  }
  else if(s==='error'){ pill.hidden=false; pill.textContent='Couldn’t save — tap to retry'; pill.className='syncpill bad'; }
  else if(s==='reauth'){ pill.hidden=false; pill.textContent='Google signed you out — tap to reconnect'; pill.className='syncpill bad'; }
}
pill.addEventListener('click', async ()=>{
  if(syncState!=='error' && syncState!=='reauth') return;
  try{ await requestToken(); }catch(e){ syncStatus('reauth'); return; }
  clearTimeout(saveTimer);
  doSave();
});

function persistIfChanged(){
  if(!loaded) return;
  if(serialize() === lastSaved) return;
  syncStatus('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 900);
}

async function doSave(){
  if(saving){ clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 600); return; }
  const snap = serialize();
  if(snap === lastSaved){ if(syncState==='saving') syncStatus('saved'); return; }
  saving = true;
  syncStatus('saving');
  try{
    await saveAll();
    lastSaved = snap;
    syncStatus('saved');
    saving = false;
    if(serialize() !== snap) persistIfChanged();
  }catch(e){
    saving = false;
    console.error('Save failed:', e);
    if(e.reauth){ syncStatus('reauth'); }
    else{
      syncStatus('error');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(doSave, 8000);
    }
  }
}

window.addEventListener('beforeunload', e=>{
  if(loaded && serialize() !== lastSaved){ e.preventDefault(); e.returnValue=''; }
});

/* ============================================================
   13. BOOT
   ============================================================ */
async function signIn(){
  authMsg('Waiting for Google…');
  try{
    await requestToken();
  }catch(e){
    authMsg(e.message==='popup_failed_to_open'
      ? 'The Google pop-up was blocked. Allow pop-ups for this site and try again.'
      : 'Sign-in didn’t finish. Try again.', true);
    return;
  }
  try{ user = await api('https://www.googleapis.com/oauth2/v3/userinfo'); }catch(e){ user = null; }
  authMsg('Opening the budget sheet…');
  try{
    const createdTabs = await ensureTabs();
    const hadHeaders = await loadAll();
    lastSaved = (createdTabs || !hadHeaders) ? '' : serialize();   // empty sheet → first save writes headers
    loaded = true;
    document.body.classList.add('authed');
    render();
  }catch(e){
    console.error(e);
    if(e.status===403) authMsg('This Google account doesn’t have access to the budget sheet. Ask to be added as an editor on the shared Sheet, then sign in again.', true);
    else if(e.status===404) authMsg('The budget sheet couldn’t be found. It may have been deleted or the link changed.', true);
    else authMsg('Couldn’t reach Google Sheets. ' + e.message, true);
  }
}

document.getElementById('signInBtn').addEventListener('click', signIn);
