<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger — household budget</title>
<meta name="description" content="A shared household budget tracker: monthly spending, committed recurring payments, category budgets, and savings goals.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23262B31'/><rect x='7' y='19' width='18' height='5' rx='2.5' fill='%23F2C230'/><rect x='7' y='9' width='11' height='5' rx='2.5' fill='%23F2C230' opacity='.45'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS — every colour, space and size comes from here
   ============================================================ */
:root{
  /* palette */
  --paper:#F3F2ED;
  --card:#FFFFFF;
  --ink:#262B31;
  --ink-soft:#4A5158;
  --muted:#868D95;
  --edge:#E4E2DA;
  --signal:#F2C230;
  --signal-deep:#C99A0E;
  --good:#4F8A6B;
  --alert:#C4553D;

  /* category tints */
  --t-sage:#DDE8DF;   --t-sage-i:#3F6B52;
  --t-lilac:#E4DEEE;  --t-lilac-i:#5B4E7A;
  --t-sky:#D8E4EF;    --t-sky-i:#3D5F80;
  --t-blush:#F1DFD8;  --t-blush-i:#8A5341;
  --t-sand:#EDE4CE;   --t-sand-i:#7A6428;
  --t-mist:#DFE5E6;   --t-mist-i:#4C6367;

  /* spacing scale (4px base) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;

  /* radii */
  --r-sm:12px; --r-md:18px; --r-lg:24px; --r-xl:30px;

  /* type */
  --display:'Sora',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;

  --shadow:0 1px 2px rgba(38,43,49,.04), 0 8px 24px rgba(38,43,49,.06);
  --shadow-lift:0 2px 4px rgba(38,43,49,.06), 0 14px 34px rgba(38,43,49,.12);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body);
  font-size:16px;
  line-height:1.55;
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 10% -10%, #EDEAE0 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, #E7EDEF 0%, transparent 55%),
    var(--paper);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;letter-spacing:-.02em}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ============================================================
   APP SHELL — phone-width column, bottom nav
   ============================================================ */
#app{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;padding:var(--s4) var(--s4) 132px}

.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  padding:var(--s5) var(--s4) var(--s3);
}
.topbar h1{font-size:22px;font-weight:600}
.topbar .sub{font-size:13px;color:var(--muted);margin-top:2px}

.monthnav{display:flex;align-items:center;gap:var(--s1)}
.monthnav button{
  width:36px;height:36px;border:1px solid var(--edge);background:var(--card);
  border-radius:50%;display:grid;place-items:center;transition:background .18s ease,transform .18s ease;
}
.monthnav button:hover:not(:disabled){background:var(--paper);transform:translateY(-1px)}
.monthnav button:disabled{opacity:.35;cursor:not-allowed}

/* ============================================================
   CARDS
   ============================================================ */
.card{background:var(--card);border-radius:var(--r-lg);padding:var(--s5);box-shadow:var(--shadow);margin-bottom:var(--s4)}
.card.tight{padding:var(--s4)}
.card h2{font-size:17px;font-weight:600;margin-bottom:var(--s1)}
.card .hint{font-size:13px;color:var(--muted);margin:0 0 var(--s4)}

.hero{background:var(--ink);color:#fff;border-radius:var(--r-xl);padding:var(--s5);box-shadow:var(--shadow-lift);margin-bottom:var(--s4)}
.hero .label{font-size:13px;color:rgba(255,255,255,.62);letter-spacing:.01em}
.hero .amount{font-size:44px;font-weight:700;margin:var(--s1) 0 0;line-height:1}
.hero .projline{display:flex;align-items:baseline;gap:6px;margin-top:var(--s2);font-size:14px;color:rgba(255,255,255,.55)}
.hero .projline strong{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600;color:rgba(255,255,255,.8)}

/* --- SIGNATURE: the committed-spend bar --- */
.spendbar{margin-top:var(--s5)}
.spendbar .track{
  position:relative;height:16px;border-radius:8px;
  background:rgba(255,255,255,.13);overflow:hidden;
}
.spendbar .spent{position:absolute;inset:0 auto 0 0;background:var(--signal);transition:width .5s cubic-bezier(.22,.8,.3,1)}
.spendbar .committed{
  position:absolute;top:0;bottom:0;transition:left .5s cubic-bezier(.22,.8,.3,1),width .5s cubic-bezier(.22,.8,.3,1);
  background:rgba(242,194,48,.42);
}
.spendbar .over{position:absolute;top:0;bottom:0;right:0;width:4px;background:var(--alert)}
.spendbar .legend{display:flex;gap:var(--s4);margin-top:var(--s3);font-size:12px;color:rgba(255,255,255,.6);flex-wrap:wrap}
.spendbar .legend span{display:flex;align-items:center;gap:6px}
.swatch{width:11px;height:11px;border-radius:3px;flex:none}
.swatch.solid{background:var(--signal)}
.swatch.hatch{background:rgba(242,194,48,.42)}
.swatch.track{background:rgba(255,255,255,.2)}
.basenote{margin-top:var(--s3);font-size:12px;line-height:1.5;color:rgba(255,255,255,.5)}
.linkish{background:none;border:0;padding:0;font-size:12px;color:var(--signal);text-decoration:underline;text-underline-offset:2px}
.linkish:hover{color:#fff}

/* ============================================================
   STAT PAIR
   ============================================================ */
.statrow{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-bottom:var(--s4)}
.stat{background:var(--card);border-radius:var(--r-md);padding:var(--s4);box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-size:22px;font-weight:600;margin-top:var(--s1)}
.stat .v.neg{color:var(--alert)}
.stat .v.pos{color:var(--good)}

/* ============================================================
   CATEGORY ICON CHIP
   ============================================================ */
.chip{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:19px;flex:none;line-height:1}

/* ============================================================
   ROWS / LISTS
   ============================================================ */
.row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--edge)}
.row:last-child{border-bottom:0}
.row .body{flex:1;min-width:0}
.row .name{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12.5px;color:var(--muted);margin-top:1px}
.row .right{text-align:right;flex:none}
.row .val{font-weight:600;font-size:15px}
.row .valsub{font-size:12px;color:var(--muted);margin-top:1px}
.row.ghost{opacity:.62}
.row.ghost .val{font-weight:500}

button.row{width:100%;background:none;border:0;border-bottom:1px solid var(--edge);text-align:left;transition:background .15s ease;border-radius:0}
button.row:hover{background:var(--paper)}

/* ============================================================
   BUDGET PROGRESS
   ============================================================ */
.bud{padding:var(--s3) 0;border-bottom:1px solid var(--edge)}
.bud:last-child{border-bottom:0}
.bud .head{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s2)}
.bud .head .body{flex:1;min-width:0}
.bud .head .name{font-weight:500;font-size:15px}
.bud .head .amt{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.bud .head .amt b{color:var(--ink);font-weight:600}
.meter{height:9px;border-radius:5px;background:var(--edge);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--signal);transition:width .45s cubic-bezier(.22,.8,.3,1)}
.meter i.warn{background:var(--signal-deep)}
.meter i.over{background:var(--alert)}
.meter u{position:absolute;top:0;bottom:0;text-decoration:none;background:#FAE5A8}
.bud .note{font-size:12px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:5px}
.bud .note.over{color:var(--alert);font-weight:500}

/* ============================================================
   BOTTOM NAV + FAB
   ============================================================ */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  max-width:460px;margin:0 auto;
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--edge);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:var(--s2) var(--s2) calc(var(--s2) + env(safe-area-inset-bottom));
}
.nav button{
  background:none;border:0;padding:var(--s2) 0 var(--s1);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;color:var(--muted);border-radius:var(--r-sm);
  min-height:48px;transition:color .16s ease;
}
.nav button:hover{color:var(--ink-soft)}
.nav button[aria-current="page"]{color:var(--ink);font-weight:600}
.nav button svg{width:22px;height:22px}
.nav .fabslot{position:relative}
.nav button.fab{
  position:absolute;left:50%;top:6px;transform:translateX(-50%);
  width:52px;height:52px;min-height:0;padding:0;margin:0;
  border-radius:50%;border:0;
  background:var(--good);color:#fff;
  display:flex;flex-direction:row;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(79,138,107,.35);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s ease;
}
.nav button.fab:hover{transform:translateX(-50%) scale(1.08);box-shadow:0 8px 18px rgba(79,138,107,.42)}
.nav button.fab:active{transform:translateX(-50%) scale(.94)}
.nav button.fab svg{width:24px;height:24px}

/* ============================================================
   SHEET (modal)
   ============================================================ */
.scrim{position:fixed;inset:0;background:rgba(38,43,49,.42);z-index:50;opacity:0;pointer-events:none;transition:opacity .22s ease}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:460px;margin:0 auto;
  background:var(--card);border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:var(--s4) var(--s5) calc(var(--s5) + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;
  transform:translateY(102%);transition:transform .3s cubic-bezier(.22,.8,.3,1);
  box-shadow:0 -8px 40px rgba(38,43,49,.2);
}
.sheet.open{transform:translateY(0)}
.grabber{width:38px;height:4px;border-radius:2px;background:var(--edge);margin:0 auto var(--s4)}
.sheet h2{font-size:20px;font-weight:600;margin-bottom:var(--s1)}
.sheet .hint{font-size:13.5px;color:var(--muted);margin:0 0 var(--s5)}

/* ============================================================
   FORM ELEMENTS
   ============================================================ */
label{display:block;font-size:13px;font-weight:500;color:var(--ink-soft);margin-bottom:6px}
input[type=text],input[type=number],input[type=date],select{
  width:100%;padding:12px var(--s3);border:1.5px solid var(--edge);border-radius:var(--r-sm);
  background:var(--paper);font-family:var(--body);font-size:16px;color:var(--ink);
  transition:border-color .16s ease,background .16s ease;
}
input:focus,select:focus{border-color:var(--ink);background:var(--card);outline:none}
.field{margin-bottom:var(--s4)}
.field .err{font-size:12.5px;color:var(--alert);margin-top:5px;font-weight:500}
.field.bad input,.field.bad select{border-color:var(--alert)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}

.bigamount{
  width:100%;border:0;background:none;text-align:center;
  font-family:var(--display);font-weight:700;font-size:52px;color:var(--ink);
  padding:var(--s5) 0 var(--s3);letter-spacing:-.03em;
}
.bigamount:focus{outline:none}
.bigamount::placeholder{color:var(--edge)}

.btn{
  width:100%;padding:15px;border:0;border-radius:var(--r-md);
  background:var(--signal);color:var(--ink);font-weight:600;font-size:16px;
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease;
}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px rgba(201,154,14,.32)}
.btn:disabled{background:var(--edge);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:none;border:1.5px solid var(--edge);color:var(--ink-soft)}
.btn.ghost:hover{background:var(--paper);box-shadow:none}
.btn.danger{background:none;color:var(--alert);border:1.5px solid var(--edge)}
.btn.danger:hover{background:#FBF0ED;box-shadow:none}
.btn.sm{padding:10px var(--s4);width:auto;font-size:14px;border-radius:var(--r-sm)}

.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:var(--s2)}
.pick{
  background:var(--paper);border:1.5px solid transparent;border-radius:var(--r-md);
  padding:var(--s3) var(--s2);display:flex;flex-direction:column;align-items:center;gap:6px;
  font-size:11.5px;line-height:1.25;text-align:center;color:var(--ink-soft);min-height:88px;justify-content:center;
  transition:border-color .15s ease,background .15s ease,transform .15s ease;
}
.pick:hover{transform:translateY(-2px);background:var(--card)}
.pick[aria-pressed="true"]{border-color:var(--ink);background:var(--card);color:var(--ink);font-weight:600}
.pick .chip{width:38px;height:38px;font-size:17px}

.seg{display:grid;grid-auto-flow:column;gap:var(--s1);background:var(--paper);padding:4px;border-radius:var(--r-sm);margin-bottom:var(--s4)}
.seg button{border:0;background:none;padding:9px var(--s2);border-radius:10px;font-size:13.5px;color:var(--muted);transition:background .16s ease,color .16s ease}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}

.switch{position:relative;width:46px;height:27px;flex:none;border:0;padding:0;border-radius:14px;background:var(--edge);transition:background .2s ease}
.switch[aria-checked="true"]{background:var(--signal)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s cubic-bezier(.34,1.4,.64,1)}
.switch[aria-checked="true"]::after{transform:translateX(19px)}

.cbox{
  position:relative;width:24px;height:24px;flex:none;padding:0;
  border:1.5px solid var(--edge);background:var(--card);border-radius:7px;
  transition:background .16s ease,border-color .16s ease;
}
.cbox[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.cbox::after{
  content:"";position:absolute;left:7.5px;top:3.5px;width:5px;height:10px;
  border:solid #fff;border-width:0 2.5px 2.5px 0;
  transform:rotate(45deg) scale(0);transition:transform .16s cubic-bezier(.34,1.4,.64,1);
}
.cbox[aria-checked="true"]::after{transform:rotate(45deg) scale(1)}
.row.cand[aria-checked="true"]{background:var(--paper)}
.candsum{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  margin:var(--s2) 0 var(--s4);font-size:13px;color:var(--muted);
}
.candall{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:2px}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--paper);color:var(--ink-soft);letter-spacing:.02em}
.tag.card-t{background:var(--t-sky);color:var(--t-sky-i)}
.tag.auto-t{background:var(--t-sage);color:var(--t-sage-i)}
.tag.est{background:var(--t-sand);color:var(--t-sand-i)}

/* ============================================================
   EMPTY / FLASH / DROPZONE
   ============================================================ */
.empty{text-align:center;padding:var(--s6) var(--s4);color:var(--muted)}
.empty .mark{font-size:34px;margin-bottom:var(--s3);opacity:.5}
.empty p{margin:0 0 var(--s4);font-size:14px;max-width:34ch;margin-inline:auto}

.flash{
  position:fixed;left:var(--s4);right:var(--s4);bottom:112px;z-index:70;max-width:428px;margin:0 auto;
  background:var(--ink);color:#fff;padding:var(--s3) var(--s4);border-radius:var(--r-md);
  font-size:14px;box-shadow:var(--shadow-lift);
  opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .25s ease,transform .25s ease;
}
.flash.show{opacity:1;transform:translateY(0)}
.flash.warn{background:var(--alert)}

.drop{
  border:2px dashed var(--edge);border-radius:var(--r-md);padding:var(--s6) var(--s4);
  text-align:center;color:var(--muted);font-size:14px;transition:border-color .18s ease,background .18s ease;
}
.drop.hot{border-color:var(--signal-deep);background:#FBF6E6;color:var(--ink-soft)}
.drop strong{display:block;color:var(--ink);font-weight:600;margin-bottom:4px;font-size:15px}

.warnbox{background:#FBF0ED;border:1px solid #E9CDC5;border-radius:var(--r-sm);padding:var(--s3) var(--s4);font-size:13.5px;color:#8A3D2A;margin-bottom:var(--s4)}
.warnbox b{display:block;margin-bottom:2px}

.netline{display:flex;align-items:flex-end;gap:3px;height:60px;margin:var(--s4) 0 var(--s2)}
.netline i{flex:1;background:var(--t-sky);border-radius:4px 4px 0 0;min-height:4px;transition:height .4s ease}
.netline i:last-child{background:var(--signal)}
.netlabels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}

/* ============================================================
   SIGN-IN SCREEN + SYNC PILL
   ============================================================ */
body:not(.authed) #app{display:none}
body.authed #authScreen{display:none}
#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--s5)}
.authcard{
  background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-lift);
  padding:var(--s7) var(--s6);max-width:400px;width:100%;text-align:center;
}
.authcard .logo{width:56px;height:56px;margin:0 auto var(--s4)}
.authcard h1{font-size:26px;margin-bottom:var(--s2)}
.authcard p{font-size:14.5px;color:var(--ink-soft);margin:0 0 var(--s5);line-height:1.5}
.gbtn{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  padding:13px var(--s4);border:1px solid var(--edge);border-radius:999px;background:#fff;
  font-weight:600;font-size:15.5px;transition:box-shadow .18s ease,transform .18s ease;
}
.gbtn:not(:disabled):hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.gbtn:disabled{opacity:.5;cursor:default}
.authmsg{margin-top:var(--s4);font-size:13px;color:var(--muted);min-height:20px}
.authmsg.err{color:var(--alert);font-weight:500}

.syncpill{
  position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:80;
  background:var(--ink);color:#fff;border:0;border-radius:999px;
  padding:6px 14px;font-size:12.5px;font-weight:500;box-shadow:var(--shadow-lift);
  cursor:default;
}
.syncpill.ok{background:var(--good)}
.syncpill.bad{background:var(--alert);cursor:pointer}


/* ============================================================
   TRENDS — charts
   ============================================================ */
.catscroll{display:flex;gap:var(--s2);overflow-x:auto;padding:0 0 var(--s2);margin:0 0 var(--s4);scrollbar-width:none}
.catscroll::-webkit-scrollbar{display:none}
.catscroll button{
  flex:none;display:flex;align-items:center;gap:7px;padding:8px 13px 8px 8px;border:1.5px solid transparent;
  background:var(--paper);border-radius:999px;font-size:13px;color:var(--ink-soft);white-space:nowrap;
  transition:border-color .15s ease,background .15s ease;
}
.catscroll button[aria-pressed="true"]{border-color:var(--ink);background:var(--card);color:var(--ink);font-weight:600}
.catscroll .chip{width:26px;height:26px;border-radius:9px;font-size:13px}

.bars{display:flex;align-items:flex-end;gap:4px;height:150px;margin:var(--s4) 0 var(--s2)}
.barcol{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:5px;
  background:none;border:0;padding:0;border-radius:6px 6px 0 0;transition:opacity .15s ease}
.barcol:hover{opacity:.75}
.barcol .bv{font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1}
.barcol .br{width:100%;background:var(--signal);border-radius:5px 5px 0 0;min-height:3px;transition:height .4s cubic-bezier(.22,.8,.3,1)}
.barcol[aria-pressed="true"] .br{background:var(--ink)}
.barcol[aria-pressed="true"] .bv{color:var(--ink);font-weight:600}
.barlabels{display:flex;gap:4px;margin-bottom:var(--s4)}
.barlabels span{flex:1;text-align:center;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden}

.donutwrap{display:flex;justify-content:center;padding:var(--s2) 0 var(--s4)}
.donut{transform:rotate(-90deg);transform-origin:90px 90px}   /* spin about the circle centre, not the SVG corner */
.donut circle{fill:none;stroke-width:26}
.donutmid{text-anchor:middle}
.donutmid .dm-big{font-size:26px;font-weight:700;font-family:var(--display);fill:var(--ink)}
.donutmid .dm-sm{font-size:10px;fill:var(--muted);font-family:var(--body);letter-spacing:.06em}

.legrow{display:flex;align-items:center;gap:var(--s3);padding:10px 0;border-bottom:1px solid var(--edge)}
.legrow:last-child{border-bottom:0}
.legrow .dot{width:11px;height:11px;border-radius:3px;flex:none}
.legrow .ln{flex:1;font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legrow .lp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;width:38px;text-align:right}
.legrow .lv{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--display)}

.rangegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:var(--s2);margin-bottom:var(--s4)}
.rangegrid button{background:var(--paper);border:1.5px solid transparent;border-radius:var(--r-sm);padding:11px var(--s2);
  font-size:13px;color:var(--ink-soft);transition:border-color .15s ease,background .15s ease}
.rangegrid button[aria-pressed="true"]{border-color:var(--ink);background:var(--card);color:var(--ink);font-weight:600}

.hist{display:flex;align-items:flex-end;gap:3px;height:70px;margin:var(--s2) 0}
.hist i{flex:1;background:var(--edge);border-radius:3px 3px 0 0;min-height:2px}
.hist i.on{background:var(--signal)}
.histlabels{display:flex;gap:3px;font-size:10.5px;color:var(--muted)}
.histlabels span{flex:1;min-width:0;text-align:center;white-space:nowrap}

.iconbtn{width:36px;height:36px;border:1px solid var(--edge);background:var(--card);border-radius:50%;
  display:grid;place-items:center;transition:background .18s ease,transform .18s ease}
.iconbtn:hover{background:var(--paper);transform:translateY(-1px)}
.iconbtn svg{width:16px;height:16px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
</style>
</head>

    <h1>Ledger</h1>

<script>
/* ============================================================
   1. CATEGORIES
   ============================================================ */
const CATEGORIES = [
  {id:'groceries', name:'Groceries',            icon:'🥬', tint:'sage'},
  {id:'restaurants',name:'Restaurants & Bars',  icon:'🍽️', tint:'blush'},
  {id:'coffee',    name:'Coffee & Snacks',      icon:'☕', tint:'sand'},
  {id:'housing',   name:'Housing',              icon:'🏠', tint:'mist'},
  {id:'utilities', name:'Utilities',            icon:'💡', tint:'sand'},
  {id:'home',      name:'Home & Household',     icon:'🧺', tint:'mist'},
  {id:'insurance', name:'Insurance',            icon:'🛡️', tint:'sky'},
  {id:'transport', name:'Transportation',       icon:'🚗', tint:'sky'},
  {id:'trvstay',   name:'Travel — Stays',       icon:'🏨', tint:'lilac'},
  {id:'trvmove',   name:'Travel — Transport',   icon:'✈️', tint:'lilac'},
  {id:'trvfun',    name:'Travel — Food & Fun',  icon:'🗺️', tint:'lilac'},
  {id:'shopping',  name:'Shopping',             icon:'🛍️', tint:'blush'},
  {id:'fun',       name:'Entertainment & Rec',  icon:'🎟️', tint:'sage'},
  {id:'health',    name:'Health & Medical',     icon:'🩺', tint:'sky'},
  {id:'subs',      name:'Subscriptions',        icon:'🔁', tint:'lilac'},
  {id:'kids',      name:'Kids & School',        icon:'🎒', tint:'sage'},
  {id:'education', name:'Education & Career',   icon:'📚', tint:'sand'},
  {id:'uncat',     name:'Uncategorized',        icon:'❓', tint:'mist'}
];
const TRAVEL_IDS = ['trvstay','trvmove','trvfun'];
const catById = id => CATEGORIES.find(c=>c.id===id) || CATEGORIES.find(c=>c.id==='uncat');

/* ============================================================
   2. STATE
   ============================================================ */
const today = new Date();
const state = {
  month: `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`,
  transactions: [],
  recurring: [],
  budgets: CATEGORIES.reduce((o,c)=>(o[c.id]={on:false,amount:0},o),{}),
  overall:{on:false, amount:0},
  raises:{},
  travelBudget:{on:false, amount:0, name:'Trip'},
  goals:[],
  accounts:[],
  snapshots:{},
  rules:[],
  view:'home'
};
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ============================================================
   3. HELPERS
   ============================================================ */
const money = (n,dec) => '$' + Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:dec?2:0,maximumFractionDigits:dec?2:0});
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monthLabel = m => new Date(m+'-02').toLocaleDateString('en-US',{month:'long',year:'numeric'});
const shortDate = d => new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
const daysInMonth = m => new Date(+m.slice(0,4), +m.slice(5,7), 0).getDate();
const isCurrentMonth = () => state.month === `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
const ordinal = n => n + (['th','st','nd','rd'][(n%100-20)%10] || ['th','st','nd','rd'][n%100] || 'th');

const monthTx = () => state.transactions.filter(t => t.date.slice(0,7) === state.month);
const spentTotal = () => monthTx().reduce((s,t)=>s+t.amount,0);
const spentByCat = id => monthTx().filter(t=>t.cat===id).reduce((s,t)=>s+t.amount,0);

/* A recurring payment with a startMonth only applies from that month on —
   used when one is created from an existing past transaction, so marking
   an old charge as recurring doesn't rewrite history before that point. */
const recurringActive = (r,m) => !r.startMonth || m >= r.startMonth;

/* Which recurring payments have NOT landed yet this month */
function unpaidRecurring(){
  const paid = new Set(monthTx().map(t=>t.rec).filter(Boolean));
  return state.recurring.filter(r=>recurringActive(r,state.month) && !paid.has(r.id));
}
const committedTotal = () => unpaidRecurring().reduce((s,r)=>s+r.amount,0);
const committedByCat = id => unpaidRecurring().filter(r=>r.cat===id).reduce((s,r)=>s+r.amount,0);

/* Post autopay recurring items whose day-of-month has arrived */
function postDueAutopays(){
  if(!isCurrentMonth()) return;
  const paid = new Set(monthTx().map(t=>t.rec).filter(Boolean));
  state.recurring.forEach(r=>{
    if(r.method!=='auto' || paid.has(r.id) || !recurringActive(r,state.month)) return;
    if(today.getDate() >= r.day){
      state.transactions.push({
        id:uid('t'), date:`${state.month}-${String(r.day).padStart(2,'0')}`,
        desc:r.name, amount:r.amount, cat:r.cat, src:'auto', rec:r.id
      });
    }
  });
}

/* ---- History and the "typical month" baseline ----
   Imported CSVs only contain card charges. Rent, utilities and other autopay
   never appear in them, so a past month would look thousands of dollars
   cheaper than the current one. Backfilling autopay into any past month that
   has card data makes the comparison honest. Amounts are today's figures, so
   older months are approximate — flagged in the interface. */
const thisMonthKey = () => `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;

function backfillPastAutopays(){
  const cur = thisMonthKey();
  const byMonth = {};
  state.transactions.forEach(t=>{
    const m = t.date.slice(0,7);
    (byMonth[m] = byMonth[m] || {ids:new Set(), any:false});
    byMonth[m].any = true;
    if(t.rec) byMonth[m].ids.add(t.rec);
  });
  Object.keys(byMonth).forEach(m=>{
    if(m >= cur) return;                       // only completed months
    state.recurring.forEach(r=>{
      if(r.method!=='auto' || byMonth[m].ids.has(r.id) || !recurringActive(r,m)) return;
      const day = Math.min(r.day, daysInMonth(m));
      state.transactions.push({
        id:uid('t'), date:`${m}-${String(day).padStart(2,'0')}`,
        desc:r.name, amount:r.amount, cat:r.cat, src:'auto', rec:r.id, approx:true
      });
      byMonth[m].ids.add(r.id);
    });
  });
}

const totalForMonth = m => state.transactions.filter(t=>t.date.slice(0,7)===m).reduce((s,t)=>s+t.amount,0);

/* A one-off is kept out of the "typical month" average only. It still counts
   in full toward the month it happened in — you did spend that money. If you
   knew it was coming, you raise that month's budget instead. */
const isRegular = t => !t.oneoff;
const regularForMonth = m => state.transactions.filter(t=>t.date.slice(0,7)===m && isRegular(t)).reduce((s,t)=>s+t.amount,0);

/* One-time budget raises for a given month */
const RAISE_REASONS = ['Large purchase','Car','Vacation','Home repair','Medical','Moving','Family event','Other'];
const raisesFor = m => state.raises[m] || [];
const raiseTotal = m => raisesFor(m).reduce((s,r)=>s+r.amount,0);

/* Average of up to the last 3 completed months before the one being viewed */
function baseline(){
  const months = [...new Set(state.transactions.map(t=>t.date.slice(0,7)))]
    .filter(m => m < state.month && m < thisMonthKey())
    .sort().slice(-3);
  if(!months.length) return null;
  return {avg: months.reduce((s,m)=>s+regularForMonth(m),0)/months.length, n: months.length};
}

function flash(msg, warn){
  const el = document.getElementById('flash');
  el.textContent = msg;
  el.className = 'flash show' + (warn ? ' warn' : '');
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.className = 'flash'; }, 3600);
}

/* ============================================================
   4. SHEET (modal) PLUMBING
   ============================================================ */
const sheetEl = document.getElementById('sheet');
const scrimEl = document.getElementById('scrim');
let lastFocus = null;

function openSheet(html){
  lastFocus = document.activeElement;
  sheetEl.innerHTML = '<div class="grabber"></div>' + html;
  sheetEl.classList.add('open');
  scrimEl.classList.add('open');
  const f = sheetEl.querySelector('input,select,button');
  if(f) setTimeout(()=>f.focus(),260);
}
function closeSheet(){
  sheetEl.classList.remove('open');
  scrimEl.classList.remove('open');
  if(lastFocus) lastFocus.focus();
}
scrimEl.addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if(e.key==='Escape' && sheetEl.classList.contains('open')) closeSheet(); });

/* ============================================================
   5. VIEWS
   ============================================================ */
const isPastMonth = () => state.month < thisMonthKey();
const TITLES = {home:[()=>isCurrentMonth()?'This month':monthLabel(state.month),
                      ()=>isCurrentMonth()?monthLabel(state.month):'Closed month'],
                trends:[()=>'Trends',()=>'Categories, the past year, and outliers'],
                budget:[()=>'Budget',()=>'Caps, recurring & commitments'],
                goals:[()=>'Goals',()=>'Assets and what you\'re building toward'],
                import:[()=>'Import',()=>'Chase CSV and categorization rules']};

function render(){
  postDueAutopays();
  backfillPastAutopays();
  const [t,s] = TITLES[state.view];
  document.getElementById('viewTitle').textContent = t();
  document.getElementById('viewSub').textContent = s();
  const showMonth = !['import','trends'].includes(state.view);
  document.getElementById('prevMonth').style.display = showMonth ? '' : 'none';
  document.getElementById('nextMonth').style.display = showMonth ? '' : 'none';
  document.getElementById('nextMonth').disabled = isCurrentMonth();
  document.querySelectorAll('.nav button[data-view]').forEach(b=>{
    if(b.dataset.view===state.view) b.setAttribute('aria-current','page');
    else b.removeAttribute('aria-current');
  });
  /* Rebuilding the view throws away the scroll position and the focused
     control, so a toggle deep down the page would bounce you to the top.
     Both are captured and put back. Switching views scrolls to the top
     from go() instead. */
  const main = document.getElementById('main');
  const y = window.scrollY;
  const held = main.contains(document.activeElement) ? document.activeElement : null;
  const heldKey = held && held.getAttribute('aria-label') ? held.tagName+'|'+held.getAttribute('aria-label') : null;

  main.innerHTML = ({home:viewHome,trends:viewTrends,budget:viewBudget,goals:viewGoals,import:viewImport})[state.view]();

  window.scrollTo({top:y,behavior:'instant'});
  if(heldKey){
    const again = [...main.querySelectorAll('[aria-label]')]
      .find(e => e.tagName+'|'+e.getAttribute('aria-label') === heldKey);
    if(again) again.focus({preventScroll:true});
  }
  persistIfChanged();
}

/* ---------- HOME ---------- */
function viewHome(){
  const spent = spentTotal();
  const committed = committedTotal();
  const projected = spent + committed;

  /* The bar measures everything you spent — one-offs included — against a
     reference line. That line is your budget or your typical month, plus any
     one-time raise you set for this month. */
  const cap = state.overall.on ? state.overall.amount : 0;
  const base = cap ? null : baseline();
  const mode = cap ? 'budget' : base ? 'typical' : 'split';
  const bump = raiseTotal(state.month);
  const baseRef = cap || (base ? base.avg : 0);
  const ref = baseRef ? baseRef + bump : 0;
  const denom = ref || Math.max(projected, 1);

  const pctSpent = Math.min(100, spent/denom*100);
  const pctComm  = Math.min(100-pctSpent, committed/denom*100);
  const over = ref && projected > ref;
  const diff = ref ? projected - ref : 0;

  const dim = daysInMonth(state.month);
  const dayNow = isCurrentMonth() ? today.getDate() : dim;
  const daysLeft = Math.max(0, dim - dayNow);

  const tx = monthTx().slice().sort((a,b)=>b.date.localeCompare(a.date));
  const upcoming = unpaidRecurring().slice().sort((a,b)=>(a.day||99)-(b.day||99));
  const raises = raisesFor(state.month);

  const activeBudgets = CATEGORIES.filter(c=>state.budgets[c.id]?.on && state.budgets[c.id].amount>0);

  const refLegend = ref ? `Left of ${money(ref)}` : '';

  return `
  <section class="hero">
    <div class="label">${isPastMonth()?'Spent in':'Spent so far in'} ${esc(monthLabel(state.month))}</div>
    <div class="amount num">${money(spent,false)}</div>
    ${committed>0
      ? (isPastMonth()
          ? `<div class="projline"><strong>${money(committed,false)}</strong> of recurring never landed</div>`
          : `<div class="projline">+ <strong>${money(committed,false)}</strong> still expected this month</div>`)
      : `<div class="projline">${isPastMonth()?'Every recurring payment landed':'Everything recurring has landed'}</div>`}

    <div class="spendbar">
      <div class="track" role="img" aria-label="${money(spent)} spent, ${money(committed)} still committed${ref?`, against ${money(ref)}`:''}">
        <div class="spent" style="width:${pctSpent}%"></div>
        <div class="committed" style="left:${pctSpent}%;width:${pctComm}%"></div>
        ${over?'<div class="over"></div>':''}
      </div>
      <div class="legend">
        <span><i class="swatch solid"></i>Paid</span>
        <span><i class="swatch hatch"></i>Committed</span>
        ${refLegend?`<span><i class="swatch track"></i>${refLegend}</span>`:''}
      </div>
      ${bump>0 ? `<div class="basenote">${mode==='budget'?'Budget':'Typical month'} of ${money(baseRef)}, raised by <strong style="color:var(--signal)">${money(bump)}</strong> for ${esc(raises.map(r=>r.reason.toLowerCase()).join(' and '))}. <button type="button" class="linkish" onclick="go('budget')">Manage</button></div>` : ''}
      ${mode==='typical' && !bump ? `<div class="basenote">Measured against your average of the last ${base.n} month${base.n===1?'':'s'}. <button type="button" class="linkish" onclick="addRaise()">Expecting a big month?</button></div>`
        : mode==='split' ? `<div class="basenote">No budget set and no past months to compare with yet. Import a few months of Chase history and the bar will measure against a typical month.</div>` : ''}
    </div>
  </section>

  <div class="statrow">
    <div class="stat">
      <div class="k">Projected total</div>
      <div class="v num ${over?'neg':''}">${money(projected,false)}</div>
    </div>
    <div class="stat">
      ${ref ? `<div class="k">${mode==='budget'?'Left after commitments':isPastMonth()?'vs that month\'s line':'vs this month\'s line'}</div>
        <div class="v num ${diff>0?'neg':'pos'}">${diff>0?'+':'−'}${money(diff,false)}</div>`
      : `<div class="k">Days left</div><div class="v num">${daysLeft}</div>`}
    </div>
  </div>

  ${activeBudgets.length ? `
  <section class="card">
    <h2>Category budgets</h2>
    <p class="hint">Full colour is paid. Faded is recurring that hasn't landed yet.</p>
    ${activeBudgets.map(c=>budgetMeter(c)).join('')}
  </section>` : ''}

  <section class="card">
    <h2>${isPastMonth()?'Never landed':'Still expected'}</h2>
    <p class="hint">${upcoming.length ? (isPastMonth()?'Recurring payments with no matching charge that month.':'Recurring payments not yet posted this month.') : ''}</p>
    ${upcoming.length ? upcoming.map(r=>`
      <div class="row ghost">

function budgetMeter(c){
  const b = state.budgets[c.id];
  const paid = spentByCat(c.id), comm = committedByCat(c.id);
  const pPaid = Math.min(100, paid/b.amount*100);
  const pComm = Math.min(100-pPaid, comm/b.amount*100);
  const total = paid + comm;
  const isOver = total > b.amount;
  const isWarn = !isOver && total > b.amount*0.85;
  return `<div class="bud">
    <div class="head">
      <div class="chip" style="background:var(--t-${c.tint});color:var(--t-${c.tint}-i)">${c.icon}</div>
      <div class="body"><div class="name">${esc(c.name)}</div></div>
      <div class="amt"><b>${money(paid,false)}</b> of ${money(b.amount,false)}</div>
    </div>
    <div class="meter" role="img" aria-label="${esc(c.name)}: ${money(paid)} paid of ${money(b.amount)}">
      <i class="${isOver?'over':isWarn?'warn':''}" style="width:${pPaid}%"></i>
      ${comm>0?`<u style="left:${pPaid}%;width:${pComm}%"></u>`:''}
    </div>
    ${isOver ? `<div class="note over">⚠ Over by ${money(total-b.amount,false)} once commitments land</div>`
      : comm>0 ? `<div class="note">${money(comm,false)} still expected · ${money(b.amount-total,false)} left after that</div>`
      : `<div class="note">${money(b.amount-paid,false)} left</div>`}
  </div>`;
}

const CHART_COLORS = ['#F2C230','#4F8A6B','#3D5F80','#5B4E7A','#C4553D','#7A6428','#4C6367','#A8794F','#B9B4A6'];

const trends = {mode:'category', cats:new Set(['groceries']), interval:'month', bar:null,
                range:'all', rMin:null, rMax:null};

/* Last n month keys ending with the current month */
function lastMonths(n){
  const out=[];
  for(let i=n-1;i>=0;i--){
    const d=new Date(today.getFullYear(), today.getMonth()-i, 1);
    out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  }
  return out;
}
/* Last n Monday-start weeks, ending with the week containing today */
function lastWeeks(n){
  /* Midnight, not the current clock time: transactions are placed at local
     noon, so a week that began at, say, 12:08 would push that Monday's own
     charges into the previous week — and regroup them as the day wore on. */
  const out=[], base=new Date(today.getFullYear(), today.getMonth(), today.getDate());
  base.setDate(base.getDate() - ((base.getDay()+6)%7));   // back to Monday
  for(let i=n-1;i>=0;i--){
    const d=new Date(base); d.setDate(d.getDate()-i*7);
    out.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,
              label:d.toLocaleDateString('en-US',{month:'short',day:'numeric'}), start:d});
  }
  return out;
}
const txInMonth = (cats,m) => state.transactions.filter(t=>cats.has(t.cat) && t.date.slice(0,7)===m);
/* Bar columns are only ~20px wide, so thousands are shortened to fit.
   The exact figure is in the bar's aria-label and in the detail card. */
const barValue = v => !v ? '' : v >= 1000 ? Math.round(v/100)/10+'k' : String(Math.round(v));
function txInWeek(cats,w){
  const end=new Date(w.start); end.setDate(end.getDate()+7);
  return state.transactions.filter(t=>{
    if(!cats.has(t.cat)) return false;
    const d=new Date(t.date+'T12:00:00');
    return d>=w.start && d<end;
  });
}

function viewTrends(){
  return `

/* ---------- Mode 1: one category over time ---------- */
function trendCategory(){
  const selectedCats = CATEGORIES.filter(x=>trends.cats.has(x.id));  // stable order -> stable colors
  const weekly = trends.interval==='week';
  const rawBuckets = weekly ? lastWeeks(12) : lastMonths(12);
  const buckets = rawBuckets.map(b=>{
    const label = weekly ? b.label : new Date(b+'-02').toLocaleDateString('en-US',{month:'short'});
    const tx = weekly ? txInWeek(trends.cats,b) : txInMonth(trends.cats,b);
    const perCat = selectedCats.map(c=>tx.filter(t=>t.cat===c.id).reduce((s,t)=>s+t.amount,0));
    return {label, tx, perCat, total: perCat.reduce((a,b)=>a+b,0)};
  });
  const vals = buckets.map(b=>b.total);
  const max = Math.max(...vals,1);
  const withData = vals.filter(v=>v>0);
  const avg = withData.length ? withData.reduce((a,b)=>a+b,0)/withData.length : 0;
  const delta = vals[vals.length-1] - (vals[vals.length-2] || 0);
  const sel = trends.bar==null ? vals.length-1 : trends.bar;
  const selBucket = buckets[sel];
  const selTx = (selBucket?selBucket.tx:[]).slice().sort((a,b)=>b.amount-a.amount);

  const heading = selectedCats.length===1 ? selectedCats[0].name
    : selectedCats.length<=3 ? selectedCats.map(c=>c.name).join(' + ')
    : `${selectedCats.length} categories`;
  const rangeTotal = selectedCats.map((c,i)=>buckets.reduce((s,b)=>s+b.perCat[i],0));

  return `
  <div class="catscroll" role="group" aria-label="Pick one or more categories">
    ${CATEGORIES.filter(x=>x.id!=='uncat').map(x=>`
      <button type="button" aria-pressed="${trends.cats.has(x.id)}" onclick="toggleTrendCat('${x.id}')">
        <span class="chip" style="background:var(--t-${x.tint});color:var(--t-${x.tint}-i)">${x.icon}</span>${esc(x.name)}
      </button>`).join('')}
  </div>

  <section class="card">
    <h2>${esc(heading)}</h2>
    <p class="hint">Last 12 ${weekly?'weeks':'months'} · tap a bar for detail${selectedCats.length>1?' · tap a category above to add or remove it':''}</p>
    <div class="seg" role="group" aria-label="Interval">
      <button type="button" aria-pressed="${!weekly}" onclick="setTrend('interval','month')">Monthly</button>
      <button type="button" aria-pressed="${weekly}" onclick="setTrend('interval','week')">Weekly</button>
    </div>

    <div class="bars">
      ${buckets.map((b,i)=>`
        <button type="button" class="barcol" aria-pressed="${i===sel}" aria-label="${esc(b.label)}: ${money(b.total)}" onclick="setTrend('bar',${i})">
          <span class="bv">${barValue(b.total)}</span>
          <span class="br" style="height:${Math.max(2, b.total/max*100)}%;display:flex;flex-direction:column-reverse;overflow:hidden;background:${selectedCats.length>1?'transparent':'var(--signal)'}">
            ${selectedCats.length>1 ? selectedCats.map((c,ci)=>b.total>0 && b.perCat[ci]>0
                ? `<span style="flex:0 0 ${(b.perCat[ci]/b.total*100).toFixed(2)}%;background:${CHART_COLORS[ci%CHART_COLORS.length]}"></span>` : '').join('') : ''}
          </span>
        </button>`).join('')}
    </div>
    <div class="barlabels">${buckets.map(b=>`<span>${esc(b.label)}</span>`).join('')}</div>

    ${selectedCats.length>1 ? selectedCats.map((c,i)=>`
      <div class="legrow">
        <span class="dot" style="background:${CHART_COLORS[i%CHART_COLORS.length]}"></span>
        <span class="ln">${c.icon} ${esc(c.name)}</span>
        <span class="lv">${money(rangeTotal[i],false)}</span>
      </div>`).join('') : ''}

    <div class="statrow" style="margin-bottom:0">
      <div class="stat" style="box-shadow:none;background:var(--paper)">
        <div class="k">Average</div><div class="v num">${money(avg,false)}</div>
      </div>
      <div class="stat" style="box-shadow:none;background:var(--paper)">
        <div class="k">vs previous</div>
        <div class="v num ${delta>0?'neg':'pos'}">${delta>0?'+':'−'}${money(delta,false)}</div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>${esc(selBucket?selBucket.label:'')}</h2>
    <p class="hint">${selTx.length} transaction${selTx.length===1?'':'s'} · ${money(vals[sel])}</p>
    ${selTx.length ? selTx.map(t=>{
      const tc = catById(t.cat);
      return `<div class="row">
        ${selectedCats.length>1?`<div class="chip" style="background:var(--t-${tc.tint});color:var(--t-${tc.tint}-i)">${tc.icon}</div>`:''}
        <div class="body"><div class="name">${esc(t.desc)}</div><div class="meta">${shortDate(t.date)}${selectedCats.length>1?' · '+esc(tc.name):''}</div></div>
        <div class="right"><div class="val num">${money(t.amount,true)}</div></div>
      </div>`;
    }).join('')
    : `<div class="empty"><div class="mark">–</div><p>Nothing in ${esc(heading)} for that ${weekly?'week':'month'}.</p></div>`}
  </section>`;
}

/* ---------- Mode 2: past 12 months, all categories ---------- */
function trendYear(){
  const months = lastMonths(12);
  const set = new Set(months);
  const rows = CATEGORIES.map(c=>({
    c, total: state.transactions.filter(t=>t.cat===c.id && set.has(t.date.slice(0,7))).reduce((s,t)=>s+t.amount,0)
  })).filter(r=>r.total>0).sort((a,b)=>b.total-a.total);

  /* 18 slices is unreadable — top 8 plus a combined rest */
  const top = rows.slice(0,8);
  const rest = rows.slice(8);
  const restTotal = rest.reduce((s,r)=>s+r.total,0);
  const slices = restTotal>0 ? [...top,{c:{name:`Everything else (${rest.length})`,icon:'',id:'_rest'},total:restTotal}] : top;
  const total = rows.reduce((s,r)=>s+r.total,0);

  const R=62, C=2*Math.PI*R;
  let acc=0;
  const arcs = slices.map((s,i)=>{
    const frac = s.total/total, len = frac*C, off = -acc*C;
    acc += frac;
    return `<circle r="${R}" cx="90" cy="90" stroke="${CHART_COLORS[i]}" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"></circle>`;
  }).join('');

  const first = monthLabel(months[0]).replace(' ',' ');
  const last  = monthLabel(months[11]);

  return `
  <section class="card">
    <h2>Past 12 months</h2>
    <p class="hint">${esc(first)} through ${esc(last)}</p>
    <div class="donutwrap">
      <svg width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="Spending by category over the past 12 months, total ${money(total)}">
        <g class="donut">${arcs}</g>
        <g class="donutmid">
          <text x="90" y="86" class="dm-big">${money(total,false)}</text>
          <text x="90" y="104" class="dm-sm">TOTAL</text>
        </g>
      </svg>
    </div>
    ${slices.map((s,i)=>`
      <div class="legrow">
        <span class="dot" style="background:${CHART_COLORS[i]}"></span>
        <span class="ln">${s.c.icon?s.c.icon+' ':''}${esc(s.c.name)}</span>
        <span class="lp">${Math.round(s.total/total*100)}%</span>
        <span class="lv">${money(s.total,false)}</span>
      </div>`).join('')}
  </section>

  <section class="card">
    <h2>Monthly total</h2>
    <p class="hint">Every category combined, across the same 12 months</p>
    ${(()=>{
      const vals = months.map(m=>totalForMonth(m));

const RANGES = [
  {id:'all',   label:'All',        min:0,   max:null},

  {id:'50150', label:'$50–150',    min:50,  max:150},

function trendSize(){
  const months = lastMonths(12);
  const set = new Set(months);
  const pool = state.transactions.filter(t=>set.has(t.date.slice(0,7)));
  const r = RANGES.find(x=>x.id===trends.range);
  const min = trends.range==='custom' ? (trends.rMin||0) : r.min;
  const max = trends.range==='custom' ? trends.rMax : r.max;
  const hits = pool.filter(t=>t.amount>=min && (max==null || t.amount<max))
                   .sort((a,b)=>b.amount-a.amount);
  const total = hits.reduce((s,t)=>s+t.amount,0);

  /* distribution across fixed buckets, with the active range highlighted */
  const edges=[0,25,50,75,100,150,200,300,500,1000];
  const ticks={0:'$0',2:'$50',4:'$100',7:'$300',9:'$1k+'};   // one per bucket it names
  const counts=edges.map((e,i)=>pool.filter(t=>t.amount>=e && (i===edges.length-1||t.amount<edges[i+1])).length);
  const cmax=Math.max(...counts,1);

  const byCat = {};
  hits.forEach(t=>{ byCat[t.cat]=(byCat[t.cat]||0)+t.amount; });
  const catRows = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,6);

  return `
  <section class="card">
    <h2>By transaction size</h2>
    <p class="hint">Across the past 12 months</p>
    <div class="rangegrid" role="group" aria-label="Amount range">
      ${RANGES.map(x=>`<button type="button" aria-pressed="${x.id===trends.range}" onclick="setTrend('range','${x.id}')">${esc(x.label)}</button>`).join('')}
    </div>
    ${trends.range==='custom' ? `
      <div class="two">
        <div class="field"><label for="rmin">From</label><input type="number" id="rmin" min="0" step="10" value="${trends.rMin??''}" placeholder="0" oninput="setCustom()"></div>
        <div class="field"><label for="rmax">To</label><input type="number" id="rmax" min="0" step="10" value="${trends.rMax??''}" placeholder="no limit" oninput="setCustom()"></div>
      </div>` : ''}

    <div class="hist" role="img" aria-label="Distribution of transaction sizes">
      ${counts.map((n,i)=>{
        const lo=edges[i], hi=i===edges.length-1?null:edges[i+1];
        const on = lo>=min && (max==null || (hi!=null && hi<=max) || (hi==null && max==null));
        return `<i class="${on?'on':''}" style="height:${Math.max(2,n/cmax*100)}%" title="${n} between $${lo}${hi?'–$'+hi:'+'}"></i>`;
      }).join('')}
    </div>
    <div class="histlabels">${counts.map((_,i)=>`<span>${ticks[i]||''}</span>`).join('')}</div>

    <div class="statrow" style="margin:var(--s4) 0 0">
      <div class="stat" style="box-shadow:none;background:var(--paper)">
        <div class="k">Transactions</div><div class="v num">${hits.length}</div>
      </div>
      <div class="stat" style="box-shadow:none;background:var(--paper)">
        <div class="k">Total</div><div class="v num">${money(total,false)}</div>
      </div>
    </div>
  </section>

  ${catRows.length ? `
  <section class="card">
    <h2>Where it goes</h2>
    <p class="hint">Categories with the most spending in this range</p>
    ${catRows.map(([id,v])=>{
      const c=catById(id);
      return `<div class="row">
        <div class="chip" style="background:var(--t-${c.tint});color:var(--t-${c.tint}-i)">${c.icon}</div>
        <div class="body"><div class="name">${esc(c.name)}</div>
          <div class="meta">${Math.round(v/total*100)}% of this range</div></div>
        <div class="right"><div class="val num">${money(v,false)}</div></div>
      </div>`;
    }).join('')}
  </section>` : ''}

  <section class="card">
    <h2>Matching transactions</h2>
    <p class="hint">${hits.length} found · largest first</p>
    ${hits.length ? hits.slice(0,40).map(t=>{
      const c=catById(t.cat);
      return `<button type="button" class="row" onclick="editTx('${t.id}')">
        <div class="chip" style="background:var(--t-${c.tint});color:var(--t-${c.tint}-i)">${c.icon}</div>
        <div class="body"><div class="name">${esc(t.desc)}</div>
          <div class="meta">${shortDate(t.date)} · ${esc(c.name)}</div></div>
        <div class="right"><div class="val num">${money(t.amount,true)}</div></div>
      </button>`;
    }).join('') + (hits.length>40?`<div class="row" style="border:0"><div class="body"><div class="meta">Showing the 40 largest of ${hits.length}.</div></div></div>`:'')
    : `<div class="empty"><div class="mark">–</div><p>Nothing in that range over the past 12 months.</p></div>`}
  </section>`;
}

/* ============================================================
   6. CSV IMPORT
   ============================================================ */
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=ch;
    } else if(ch==='"') q=true;
    else if(ch===','){ row.push(cell); cell=''; }
    else if(ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else if(ch!=='\r') cell+=ch;
  }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}

function applyRules(desc){
  const up = desc.toUpperCase();
  const hit = state.rules.find(r=>up.includes(r.phrase.toUpperCase()));
  return hit ? hit.cat : null;
}
const CHASE_MAP = {
  'Food & Drink':'restaurants','Groceries':'groceries','Gas':'transport','Automotive':'transport',
  'Travel':'trvmove','Shopping':'shopping','Entertainment':'fun','Health & Wellness':'health',
  'Home':'home','Bills & Utilities':'utilities','Personal':'shopping','Education':'education','Fees & Adjustments':'uncat'
};

function importCSV(text){
  const rows = parseCSV(text);
  if(rows.length<2){ flash('That file has no transactions in it.', true); return; }
  const head = rows[0].map(h=>h.trim().toLowerCase());
  const iDate = head.findIndex(h=>h.includes('transaction date'));
  const iDesc = head.findIndex(h=>h.includes('description'));
  const iAmt  = head.findIndex(h=>h.includes('amount'));
  const iCat  = head.findIndex(h=>h==='category');
  const iType = head.findIndex(h=>h==='type');
  if(iDate<0||iDesc<0||iAmt<0){
    flash('That doesn\'t look like a Chase card export — no date, description and amount columns.', true);
    return;
  }
  const existing = new Set(state.transactions.map(t=>`${t.date}|${t.desc.toUpperCase()}|${t.amount.toFixed(2)}`));
  let added=0, dupes=0, skipped=0, linked=0;

  rows.slice(1).forEach(r=>{
    const raw = (r[iAmt]||'').replace(/[$,]/g,'').trim();
    const val = parseFloat(raw);
    if(!isFinite(val)) return;
    const type = iType>=0 ? (r[iType]||'').trim().toLowerCase() : '';
    if(val > 0 || type === 'payment'){ skipped++; return; }   // card payments & refunds
    const amount = Math.abs(val);
    const desc = (r[iDesc]||'').trim();
    const parts = (r[iDate]||'').trim().split('/');
    if(parts.length<3) return;
    const date = `${parts[2].length===2?'20'+parts[2]:parts[2]}-${parts[0].padStart(2,'0')}-${parts[1].padStart(2,'0')}`;
    const key = `${date}|${desc.toUpperCase()}|${amount.toFixed(2)}`;
    if(existing.has(key)){ dupes++; return; }
    existing.add(key);

    const up = desc.toUpperCase();
    const rec = state.recurring.find(x=>x.method==='card' && x.match && up.includes(x.match.toUpperCase()));
    const cat = applyRules(desc) || (rec ? rec.cat : null) || CHASE_MAP[(r[iCat]||'').trim()] || 'uncat';
    if(rec) linked++;
    state.transactions.push({id:uid('t'), date, desc, amount, cat, src:'card', rec:rec?rec.id:undefined});
    added++;
  });

  render();
  const bits = [`${added} added`];
  if(linked) bits.push(`${linked} matched to recurring`);
  if(dupes) bits.push(`${dupes} already there`);
  if(skipped) bits.push(`${skipped} payments skipped`);
  flash(bits.join(' · '));
  if(added) go('home');
}

document.getElementById('csvFile').addEventListener('change', e=>{
  const f = e.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = ev => importCSV(ev.target.result);
  rd.onerror = () => flash('That file couldn\'t be read. Try downloading it from Chase again.', true);
  rd.readAsText(f);
  e.target.value = '';
});
document.addEventListener('dragover', e=>{
  e.preventDefault();
  const dz = document.getElementById('dropzone');
  if(dz) dz.classList.add('hot');
});
document.addEventListener('dragleave', e=>{
  if(e.relatedTarget) return;
  const dz = document.getElementById('dropzone');
  if(dz) dz.classList.remove('hot');
});
document.addEventListener('drop', e=>{
  e.preventDefault();
  const dz = document.getElementById('dropzone');
  if(dz) dz.classList.remove('hot');
  const f = e.dataTransfer.files[0];
  if(!f) return;
  if(!/\.csv$/i.test(f.name)){ flash('Only .csv files can be imported.', true); return; }
  const rd = new FileReader();
  rd.onload = ev => importCSV(ev.target.result);
  rd.readAsText(f);
});

function saveRecurring(id){
  const name = document.getElementById('rName').value.trim();
  const amount = parseFloat(document.getElementById('rAmt').value);
  const cat = document.getElementById('rCat').value;
  const method = document.querySelector('.seg button[aria-pressed="true"]').dataset.m;

  const day = method==='auto' ? parseInt(document.getElementById('rDay').value,10) : null;
  const match = method==='card' ? document.getElementById('rMatch').value.trim() : '';

  const errs=[];
  if(!name) errs.push('Give it a name.');
  if(!(amount>0)) errs.push('Enter an amount greater than zero.');
  if(method==='auto' && !(day>=1 && day<=31)) errs.push('Enter the day of the month it goes out, from 1 to 31.');
  if(method==='card' && !match) errs.push('Enter the text that appears on your statement, so imports can match it.');
  if(errs.length){
    document.getElementById('recErr').innerHTML = `<div class="warnbox"><b>Not saved yet.</b>${errs.map(esc).join(' ')}</div>`;

  }
  if(id){
    Object.assign(state.recurring.find(r=>r.id===id), {name,amount,cat,method,day,match,estimated});
    closeSheet(); render(); flash('Recurring payment updated.');
    return;
  }
  const newId = uid('r');
  const rec = {id:newId, name, amount, cat, method, day, match, estimated};
  if(pendingTxLink){
    rec.startMonth = thisMonthKey();
    const src = state.transactions.find(x=>x.id===pendingTxLink);

  }
  state.recurring.push(rec);

  pendingTxLink = null;
  closeSheet(); render();
  flash(wasLinked
    ? `${esc(name)} will be tracked as recurring from ${esc(monthLabel(thisMonthKey()))} on.`
    : `${esc(name)} added to your recurring payments.`);

/* ============================================================
   8b. FIND RECURRING — scan imported history for repeat charges
   ------------------------------------------------------------
   Only card charges can be detected this way: rent, utilities and
   anything else paid outside the Chase card never appears in the
   history, so nothing here is ever created as autopay.
   ============================================================ */

/* Statement lines carry a store or reference number that changes every
   time — "TRADER JOE'S #182" one month, "#4411" the next. Stripping those
   leaves a stable merchant key to group by. */
const PROCESSOR_PREFIX = /^(SQ\s*\*|TST\s*\*|SP\s*\*|PY\s*\*|PAYPAL\s*\*|WWW\.|POS\s+|PURCHASE\s+)/;

function normDesc(desc){
  let s = String(desc||'').toUpperCase().replace(/[‘’']/g,'').replace(/\s+/g,' ').trim();
  s = s.replace(PROCESSOR_PREFIX,'').trim();
  const star = s.split('*')[0].trim();          // AMAZON.COM*RT4YQ · GEICO *AUTO
  if(star.length >= 3) s = star;
  for(let i=0;i<4;i++){                          // trailing store / reference numbers
    const before = s
      .replace(/\s*#\s*[\w-]+$/,'')
      .replace(/\s+[0-9][\w-]*$/,'')
      .replace(/[\s\-.,]+$/,'')
      .trim();
    if(before.length < 3 || before === s) break; // never strip a name away entirely
    s = before;
  }
  return s.replace(/\s+/g,' ').trim();
}

/* The phrase imports will match on. It has to be a literal substring of
   the real statement text, so it comes from the raw descriptions rather
   than the normalized key. */
function commonPhrase(descs){
  const ups = descs.map(d=>String(d).toUpperCase().trim());   // spacing left as it appears
  let p = ups[0] || '';
  for(let i=1;i<ups.length;i++){
    let n=0;
    while(n<p.length && n<ups[i].length && p[n]===ups[i][n]) n++;
    p = p.slice(0,n);
    if(!p) break;
  }
  p = p.replace(/[\s#*\-.,]*\d*$/,'').replace(/[^A-Z0-9)]+$/,'').trim();
  if(p.length < 3){                              // nothing shared — fall back to a solid word
    const word = (ups[0]||'').split(/[\s*#]+/).find(w=>w.length>3);
    p = word || (ups[0]||'').slice(0,12).trim();
  }
  /* An import only links a charge when the raw text contains this phrase,
     so a phrase that doesn't is worse than useless. */
  return ups.every(u=>u.includes(p)) ? p : ((ups[0]||'').split(/[\s*#]+/).find(w=>w.length>3) || p);
}

/* "SPOTIFY USA" reads better as "Spotify USA" than "Spotify Usa" — short
   tokens and anything with punctuation in it are left alone. */
function titleCase(key){
  return key.replace(/\.(COM|NET|ORG)$/,'')
    .split(' ')
    .map(w => (w.length <= 3 || /[^A-Z]/.test(w)) ? w
      : w.charAt(0) + w.slice(1).toLowerCase())
    .join(' ');
}

const monthIdx = m => (+m.slice(0,4))*12 + (+m.slice(5,7)) - 1;
const median = ns => { const s = ns.slice().sort((a,b)=>a-b), h = s.length>>1;
  return s.length%2 ? s[h] : (s[h-1]+s[h])/2; };

/* A candidate has to look like one charge a month, not a shop you visit
   often: three or more distinct months, gaps of about a month, and
   roughly a single charge in each of those months. */
function detectRecurring(){
  const pool = state.transactions.filter(t => !t.rec && t.src !== 'auto' && t.amount > 0);
  if(!pool.length) return [];

  const groups = {};
  pool.forEach(t=>{
    const key = normDesc(t.desc);
    if(key.length < 3) return;
    (groups[key] = groups[key] || []).push(t);
  });

  const allMonths = [...new Set(state.transactions.map(t=>t.date.slice(0,7)))].sort();
  const newestIdx = allMonths.length ? monthIdx(allMonths[allMonths.length-1]) : 0;

  const found = [];
  Object.keys(groups).forEach(key=>{
    const txs = groups[key];
    const months = [...new Set(txs.map(t=>t.date.slice(0,7)))].sort();
    if(months.length < 3) return;

    const idxs = months.map(monthIdx);
    const gaps = idxs.slice(1).map((n,i)=>n-idxs[i]);
    const avgGap = (idxs[idxs.length-1] - idxs[0]) / (idxs.length - 1);
    if(avgGap > 1.6 || Math.max.apply(null, gaps) > 3) return;  // not monthly, or two separate runs
    if(txs.length / months.length > 1.4) return;                // a shop you visit often
    if(idxs[idxs.length-1] < newestIdx - 2) return;              // stopped months ago

    const amounts = txs.map(t=>t.amount);
    const mid = median(amounts);
    if(!(mid > 0)) return;
    const spread = (Math.max.apply(null, amounts) - Math.min.apply(null, amounts)) / mid;

    const counts = {};
    txs.forEach(t=>{ if(t.cat && t.cat!=='uncat') counts[t.cat] = (counts[t.cat]||0)+1; });
    const cat = Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0] || 'uncat';

    found.push({
      key,
      name: titleCase(key),
      phrase: commonPhrase(txs.map(t=>t.desc)),
      cat,
      amount: Math.round(mid*100)/100,
      estimated: spread > 0.10,
      spread,
      months: months.length,
      first: months[0],
      last: months[months.length-1],
      txIds: txs.map(t=>t.id),
      descs: txs.map(t=>t.desc),
      picked: false
    });
  });

  return found.filter(c=>!alreadyTracked(c))
              .sort((a,b)=> b.months - a.months || a.spread - b.spread || b.amount - a.amount);
}

/* Anything already on the Recurring list is left alone. */
function alreadyTracked(cand){
  return state.recurring.some(r=>{
    const m = (r.match||'').toUpperCase().trim();
    if(m.length >= 3 && cand.descs.some(d=>String(d).toUpperCase().includes(m))) return true;
    const rn = normDesc(r.name);
    if(rn.length < 4 || cand.key.length < 4) return false;
    return rn === cand.key || rn.includes(cand.key) || cand.key.includes(rn);
  });
}

let scanFound = [];

function findRecurring(){
  if(!state.transactions.length){

function candRow(c,i){
  const cat = catById(c.cat);
  const shortMonth = m => new Date(m+'-02').toLocaleDateString('en-US',{month:'short',year:'numeric'});
  const span = c.first === c.last ? shortMonth(c.first) : `${shortMonth(c.first)} – ${shortMonth(c.last)}`;
  return `<button type="button" class="row cand" role="checkbox" aria-checked="false" data-i="${i}" onclick="toggleCand(${i})">
    <span class="cbox" aria-hidden="true"></span>
    <span class="chip" style="background:var(--t-${cat.tint});color:var(--t-${cat.tint}-i)">${cat.icon}</span>
    <span class="body">
      <span class="name" style="display:block">${esc(c.name)}</span>
      <span class="meta" style="display:block">${esc(cat.name)} · ${c.months} months · ${esc(span)}</span>
      <span class="meta" style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px">
        <span class="tag card-t">Matches “${esc(c.phrase)}”</span>
        ${c.estimated?'<span class="tag est">Amount varies</span>':''}
      </span>
    </span>
    <span class="right"><span class="val num" style="display:block">${money(c.amount,true)}</span></span>
  </button>`;
}

function markCand(i, on){
  const el = document.querySelector(`.cand[data-i="${i}"]`);
  if(!el) return;
  el.setAttribute('aria-checked', String(on));
  el.querySelector('.cbox').setAttribute('aria-checked', String(on));
}

function toggleCand(i){
  scanFound[i].picked = !scanFound[i].picked;
  markCand(i, scanFound[i].picked);
  refreshCandCount();
}

function toggleAllCands(){
  const on = scanFound.some(c=>!c.picked);       // anything unticked → tick them all
  scanFound.forEach((c,i)=>{ c.picked = on; markCand(i, on); });
  refreshCandCount();
}

function refreshCandCount(){
  const picked = scanFound.filter(c=>c.picked);
  const n = picked.length;
  const label = document.getElementById('candCount');
  const btn = document.getElementById('candAdd');
  const all = document.getElementById('candAll');
  if(label) label.textContent = n
    ? `${n} selected · ${money(picked.reduce((s,c)=>s+c.amount,0),false)} a month`
    : 'None selected';
  if(btn){
    btn.disabled = !n;
    btn.textContent = n ? `Add ${n} recurring payment${n===1?'':'s'}` : 'Add selected';
  }
  if(all) all.textContent = scanFound.some(c=>!c.picked) ? 'Select all' : 'Clear all';
}

function addFoundRecurring(){
  const picked = scanFound.filter(c=>c.picked);
  if(!picked.length) return;
  picked.forEach(c=>{
    const id = uid('r');
    /* Card payments only — no autopay day, matched on the statement text. */
    state.recurring.push({
      id, name:c.name, amount:c.amount, cat:c.cat,
      method:'card', day:null, match:c.phrase, estimated:c.estimated
    });
    /* Link the charges it was detected from, exactly as an import would.
       Without this the payment reads as still owed in a month it has
       already been paid in. */
    const ids = new Set(c.txIds);
    state.transactions.forEach(t=>{ if(ids.has(t.id) && !t.rec) t.rec = id; });
  });
  scanFound = [];
  closeSheet(); render();
  flash(`${picked.length} recurring payment${picked.length===1?'':'s'} added.`);
}

  if(id) Object.assign(state.goals.find(g=>g.id===id), {name,target,monthly,accounts});
  else state.goals.push({id:uid('g'), name, target, monthly, accounts});
  closeSheet(); render(); flash(id?'Goal updated.':`${esc(name)} added.`);
}

function saveSnapshot(){
  const snap = {...(state.snapshots[state.month] || carryForward())};
  state.accounts.forEach(a=>{

    if(isFinite(v)) snap[a.id] = a.type==='debt' ? -Math.abs(v) : Math.abs(v);

  closeSheet(); render(); flash('Balances updated.');
}
